type Burn @entity {
  id: ID!
  block: Int!
  address: String! @index
  value: BigInt!
  txHash: String!
  account: Account!
  otherAccount: Account
  txn: TxnWithBurn @derivedFrom(field: "burn")
}

type Account @entity {
  id: ID!
  burns: [Burn!]! @derivedFrom(field: "account")
  otherBurns: [Burn!]! @derivedFrom(field: "otherAccount")
}

type TxnWithBurn @entity {
  id: ID!
  burn: Burn! @unique
}
